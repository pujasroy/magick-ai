<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MagickWorld Assistant (test)</title>
<style>
  :root { --brand:#6b3fa0; --bg:#faf7fd; --line:#e6ddf0; --ink:#2b2233; --muted:#7a6f86; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:720px; margin:0 auto; height:100vh; display:flex; flex-direction:column; }
  header { padding:14px 18px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; background:#fff; }
  header b { color:var(--brand); }
  header button { border:1px solid var(--line); background:#fff; border-radius:8px; padding:6px 10px; cursor:pointer; color:var(--muted); }
  #log { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:85%; padding:10px 14px; border-radius:14px; line-height:1.45; white-space:pre-wrap; }
  .user { align-self:flex-end; background:var(--brand); color:#fff; border-bottom-right-radius:4px; }
  .bot { align-self:flex-start; background:#fff; border:1px solid var(--line); border-bottom-left-radius:4px; }
  .cards { display:flex; gap:10px; overflow-x:auto; align-self:stretch; padding-bottom:4px; }
  .card { flex:0 0 220px; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; text-decoration:none; color:inherit; }
  .card img { width:100%; height:110px; object-fit:cover; background:#eee; display:block; }
  .card div { padding:8px 10px; font-size:13px; }
  .card .n { font-weight:600; font-size:14px; margin-bottom:3px; }
  .card .m { color:var(--muted); }
  form { display:flex; gap:8px; padding:12px; border-top:1px solid var(--line); background:#fff; }
  input { flex:1; padding:12px; border:1px solid var(--line); border-radius:10px; font-size:15px; }
  form button { background:var(--brand); color:#fff; border:0; border-radius:10px; padding:0 18px; font-size:15px; cursor:pointer; }
  .typing { color:var(--muted); font-style:italic; }
  .bot a { color:var(--brand); font-weight:600; word-break:break-word; }
</style>
</head>
<body>
<div class="wrap">
  <header><span><b>MagickWorld</b> assistant · test</span><button id="reset">New chat</button></header>
  <div id="log"></div>
  <form id="f"><input id="q" placeholder="e.g. My 6 year old wants to learn dance" autocomplete="off"><button>Send</button></form>
</div>
<script>
const log = document.getElementById('log'), q = document.getElementById('q');
let sid = null;
function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmt(text){
  // escape first, then turn [label](url), bare URLs and **bold** into HTML
  let s = esc(text);
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (m, label, url) => `<a href="${url}" target="_blank" rel="noopener">${label}</a>`);
  s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+[^\s<).,!?])/g, (m, pre, url) => `${pre}<a href="${url}" target="_blank" rel="noopener">${url}</a>`);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  return s;
}
function add(cls, text){ const d=document.createElement('div'); d.className='msg '+cls;
  if (cls.startsWith('bot')) d.innerHTML = fmt(text); else d.textContent = text;
  log.appendChild(d); log.scrollTop=log.scrollHeight; return d; }
function cards(list){
  if(!list || !list.length) return;
  const row=document.createElement('div'); row.className='cards';
  row.innerHTML = list.map(c => `<a class="card" href="${esc(c.listing_url)}" target="_blank" rel="noopener">
      ${c.image ? `<img src="${esc(c.image)}" alt="">` : ''}
      <div><div class="n">${esc(c.name)}</div>
      <div class="m">${esc(c.price)} · ${esc(c.ages)}</div>
      ${c.distance_km!=null ? `<div class="m">${esc(c.distance_km)} km away</div>` : ''}</div></a>`).join('');
  log.appendChild(row); log.scrollTop=log.scrollHeight;
}
add('bot', "Hi! I'm Magick AI 👋 Tell me what you're looking for — a class, a play zone, a birthday idea, or something to do in Jaipur — and I'll find the right place.");
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const text=q.value.trim(); if(!text) return;
  q.value=''; add('user', text);
  const t=add('bot typing', 'typing…');
  try {
    const r = await fetch('/api/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({message:text, session_id:sid})});
    const data = await r.json();
    t.remove();
    if(!r.ok){ add('bot', 'Error: '+(data.detail||r.status)); return; }
    sid=data.session_id; add('bot', data.reply); cards(data.cards);
  } catch(err){ t.remove(); add('bot', 'Network error: '+err); }
};
document.getElementById('reset').onclick = async () => {
  if(sid) await fetch('/api/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'-',session_id:sid})});
  sid=null; log.innerHTML=''; add('bot', "Fresh start! What are you looking for?");
};
</script>
</body>
</html>
